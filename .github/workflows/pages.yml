# Publish the MegaCrow web bundle to GitHub Pages.
#
# Layout (project Pages URL: https://<owner>.github.io/<repo>/):
#   /              ← GitHub Release (reuses megacrow-web artifact from the tag’s Build)
#   /<branch>/     ← branch push preview (built here with branch base)
#
# Branch deletion removes /<branch>/ from the site.
#
# Setup (once):
#   Repo Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages / (root)

name: GitHub Pages

on:
  push:
    branches:
      - "**"
  delete:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options:
          - auto
          - root
          - branch
        default: auto
      tag:
        description: "Release tag (required when target is root)"
        required: false
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Branch preview: build with /<repo>/<branch>/ base
  # ---------------------------------------------------------------------------
  build-branch:
    name: Build branch preview
    if: |
      github.ref != 'refs/heads/gh-pages' && (
        (github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.target == 'branch' ||
          github.event.inputs.target == 'auto'
        ))
      )
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ steps.target.outputs.destination }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch destination
        id: target
        shell: bash
        run: |
          set -euo pipefail
          REPO='${{ github.event.repository.name }}'
          destination='${{ github.ref_name }}'
          case "$destination" in
            docs|assets|gh-pages|.github)
              echo "Branch name '$destination' conflicts with the release site layout."
              exit 1
              ;;
          esac
          pages_base="/${REPO}/${destination}/"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "pages_base=$pages_base" >> "$GITHUB_OUTPUT"
          echo "Branch preview base=$pages_base"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write build info
        shell: bash
        env:
          MEGACROW_BRANCH: ${{ github.ref_name }}
          MEGACROW_SEQ: ${{ github.run_number }}
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          node scripts/write-build-info.mjs --from-json "$INFO"

      - name: Install
        run: npm install

      - name: Build web
        env:
          MEGACROW_BASE: ${{ steps.target.outputs.pages_base }}
        run: npm run build:web --workspace=@megacrow/ide

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-pages-branch
          path: packages/ide/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release root: reuse megacrow-web from the Build run that produced the tag
  # ---------------------------------------------------------------------------
  fetch-release:
    name: Fetch release artifact
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'root')
    runs-on: ubuntu-latest
    steps:
      - name: Download megacrow-web for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAG:-}" ]]; then
            echo "No release tag provided. For workflow_dispatch with target=root, set the tag input."
            exit 1
          fi

          echo "Resolving commit for tag: $TAG"
          REF_JSON=$(gh api "repos/${REPO}/git/ref/tags/${TAG}")
          OBJECT_TYPE=$(printf '%s' "$REF_JSON" | jq -r .object.type)
          OBJECT_SHA=$(printf '%s' "$REF_JSON" | jq -r .object.sha)
          if [[ "$OBJECT_TYPE" == "tag" ]]; then
            COMMIT_SHA=$(gh api "repos/${REPO}/git/tags/${OBJECT_SHA}" --jq .object.sha)
          else
            COMMIT_SHA="$OBJECT_SHA"
          fi
          echo "Tag $TAG → commit $COMMIT_SHA"

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow build.yml \
            --commit "$COMMIT_SHA" \
            --status completed \
            --limit 30 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')

          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Build workflow run found for commit $COMMIT_SHA (tag $TAG)."
            echo "Create a GitHub Release only from a build tag that has a megacrow-web artifact."
            exit 1
          fi
          echo "Using Build run id: $RUN_ID"

          mkdir -p dist
          if ! gh run download "$RUN_ID" --repo "$REPO" --name megacrow-web --dir dist; then
            echo "Failed to download artifact 'megacrow-web' from run $RUN_ID."
            echo "The artifact may have expired or was never uploaded for this tag."
            exit 1
          fi

          if [[ ! -f dist/index.html ]]; then
            echo "Downloaded megacrow-web artifact is missing index.html"
            find dist -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "Fetched megacrow-web ($(du -sh dist | cut -f1))"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-pages-root
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Branch delete: drop /<branch>/ from gh-pages
  # ---------------------------------------------------------------------------
  cleanup-branch:
    name: Cleanup deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      - name: Remove branch path
        id: remove
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.ref }}'
          case "$BRANCH" in
            docs|assets|gh-pages|.github|"")
              echo "Skipping cleanup for reserved or empty ref: '$BRANCH'"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ ! -d site ]]; then
            echo "gh-pages branch does not exist yet; nothing to clean."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -e "site/$BRANCH" ]]; then
            echo "No Pages path for deleted branch '$BRANCH'."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Removing site/$BRANCH"
          rm -rf "site/$BRANCH"
          # Drop nested empty parents left by feature/foo-style branches (stay inside site/).
          parent=$(dirname "$BRANCH")
          while [[ "$parent" != "." && "$parent" != "/" ]]; do
            if [[ -d "site/$parent" ]] && [[ -z "$(ls -A "site/$parent")" ]]; then
              rmdir "site/$parent"
              parent=$(dirname "$parent")
            else
              break
            fi
          done

          rm -rf site/.git
          touch site/.nojekyll
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Publish cleaned site
        if: steps.remove.outputs.should_deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: false
          keep_files: false

  # ---------------------------------------------------------------------------
  # Deploy branch preview
  # ---------------------------------------------------------------------------
  deploy-branch:
    name: Deploy branch preview
    needs: build-branch
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: megacrow-pages-branch
          path: dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ needs.build-branch.outputs.destination }}
          keep_files: true
          force_orphan: false

  # ---------------------------------------------------------------------------
  # Deploy release root
  # ---------------------------------------------------------------------------
  deploy-root:
    name: Deploy release root
    needs: fetch-release
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: megacrow-pages-root
          path: dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
          force_orphan: false
