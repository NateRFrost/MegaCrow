name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalo:
    name: @megacrow/megalo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Root lockfile still lists gitignored workspaces (ide, etc.), so prefer
      # `npm install` over `npm ci` until the lockfile matches the published tree.
      - name: Install
        run: npm install --workspace=@megacrow/megalo --include-workspace-root

      - name: Lint
        run: npm run check

      - name: Test
        run: npm test --workspace=@megacrow/megalo

      - name: Typecheck
        run: npm run typecheck --workspace=@megacrow/megalo
